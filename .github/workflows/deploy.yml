name: Build & Push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/michaelayles/bitwise-cloud-backend
  CADDY_IMAGE: ghcr.io/michaelayles/bitwise-cloud-caddy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -e "backend[dev]"

      - name: Check formatting
        run: black --check backend/app/

      - name: Type check
        run: mypy backend/app/ --ignore-missing-imports

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push SHA-tagged images first (immutable, always safe)
      - name: Build and push backend (SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push caddy (SHA tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ env.CADDY_IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: boot backend with deps and hit /api/health
      - name: Smoke test backend
        run: |
          docker network create test-net

          docker run -d --name test-postgres --network test-net \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            postgres:16-alpine

          docker run -d --name test-redis --network test-net \
            redis:7-alpine redis-server --requirepass test

          # Wait for postgres
          for i in $(seq 1 30); do
            docker exec test-postgres pg_isready -U test && break
            sleep 1
          done

          docker run -d --name test-backend --network test-net \
            -e DATABASE_URL=postgresql+asyncpg://test:test@test-postgres:5432/test \
            -e SYNC_DATABASE_URL=postgresql://test:test@test-postgres:5432/test \
            -e REDIS_URL=redis://:test@test-redis:6379/0 \
            -e JWT_SECRET=test-secret-not-for-production \
            -e UPLOAD_DIR=/tmp/uploads \
            -e INDEX_DIR=/tmp/indices \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

          # Wait for backend, then check health
          for i in $(seq 1 60); do
            STATUS=$(docker exec test-backend python -c \
              "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/api/health').read().decode())" 2>/dev/null) && break
            sleep 2
          done

          echo "Health response: $STATUS"
          echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d['status']=='healthy' else 1)"

      # Only tag :latest after smoke test passes (re-tag server-side, no local pull needed)
      - name: Tag backend as latest
        run: docker buildx imagetools create -t ${{ env.BACKEND_IMAGE }}:latest ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Tag caddy as latest
        run: docker buildx imagetools create -t ${{ env.CADDY_IMAGE }}:latest ${{ env.CADDY_IMAGE }}:${{ github.sha }}
